# =====================================================================================
# SCALIX default experiment configuration.
#
# Every key here can be overridden with --config <file> or --set key=value.
# Unknown keys are rejected, so this file is also the reference of valid keys.
# All values are INITIAL EXPERIMENTAL PARAMETERS, not tuned or universally optimal.
# =====================================================================================

# ---- Simulation timing -------------------------------------------------------------
# Master seed. Each workload derives its own seed from this, so every policy sees the
# exact same request sequence for a given workload.
simulation.seed=42
# Length of the request-arrival phase (seconds of simulated time).
simulation.durationSeconds=900
# Controller tick: arrivals are dispatched and utilization is sampled every tick.
simulation.tickSeconds=1
# How often the scaling policy is evaluated.
simulation.decisionIntervalSeconds=15
# After arrivals stop, the simulation keeps running until all requests finish or this
# many extra seconds have elapsed (unfinished requests are then reported, not hidden).
simulation.maxDrainSeconds=3600

# ---- Physical infrastructure (CloudSim Plus hosts) -----------------------------------
host.count=10
host.pes=8
host.mipsPerPe=1000
host.ramMb=32768
host.bwMbps=10000
host.storageMb=1000000

# ---- VM type (identical for every policy) --------------------------------------------
vm.pes=2
vm.mipsPerPe=1000
vm.ramMb=2048
vm.bwMbps=1000
vm.sizeMb=10000
# Time between a scale-up request and the VM accepting traffic. Modelled by SCALIX's
# load balancer (CloudSim Plus creates the VM immediately; it is billed from then on).
vm.bootSeconds=30

# ---- Pricing model (ASSUMED, illustrative; not a real provider price list) -----------
# cost = sum over VMs of billedSeconds / 3600 * vmPricePerHour
# billedSeconds = max(minimumBillingSeconds, ceil(lifetime / granularity) * granularity)
# lifetime = from scale-up request (or t=0) until the VM is destroyed or the run ends.
pricing.vmPricePerHour=0.10
pricing.billingGranularitySeconds=1
pricing.minimumBillingSeconds=60

# ---- Requests (each request = one CloudSim Plus Cloudlet) ----------------------------
# Mean length in million instructions. With vm.mipsPerPe=1000 a mean request takes
# 2 s on one PE, so one 2-PE VM serves about 1 request/second at 100% CPU.
request.meanLengthMi=2000
# Length is uniform in [mean*(1-v), mean*(1+v)].
request.lengthVariation=0.5
request.pes=1

# ---- Workloads (arrival rates in requests/second; Poisson arrivals) ------------------
workload.low.rate=2
workload.medium.rate=5
workload.high.rate=10
workload.burst.baseRate=4
workload.burst.peakRate=16
workload.burst.startSeconds=300
workload.burst.durationSeconds=120
workload.increasing.startRate=1
workload.increasing.endRate=12
workload.decreasing.startRate=12
workload.decreasing.endRate=1
workload.fluctuating.baseRate=6
workload.fluctuating.amplitude=4
workload.fluctuating.periodSeconds=240

# ---- Policy A: static allocation -----------------------------------------------------
policy.static.vmCount=8

# ---- Limits shared by both auto-scaling policies (B and C) ----------------------------
# Starts equal to policy.static.vmCount so every policy begins with the same capacity and
# only the policy differs. For a cold-start scenario use e.g. --set policy.scaling.initialVms=2
policy.scaling.initialVms=8
policy.scaling.minVms=1
policy.scaling.maxVms=20

# ---- Policy B: basic threshold scaling ----------------------------------------------
policy.threshold.upper=0.70
policy.threshold.lower=0.30
# 0 = no cooldown (classic basic threshold rule).
policy.threshold.cooldownSeconds=0

# ---- Policy C: SCALIX workload-aware scaling ----------------------------------------
policy.scalix.upper=0.70
policy.scalix.lower=0.30
# Scale up early (below 'upper') when demand is rising and utilization exceeds this.
policy.scalix.preemptiveUpper=0.55
# Utilization the policy sizes the fleet for when it scales up.
policy.scalix.targetUtilization=0.60
# Number of past decision intervals used to estimate the arrival-rate trend.
policy.scalix.observationWindow=6
# Relative slope (fraction of mean rate per decision interval) above which demand is
# RISING / below whose negative it is FALLING.
policy.scalix.trendThreshold=0.03
# When demand is RISING, busy capacity is extrapolated this many intervals ahead along the
# trend before sizing a scale-up (covers part of the VM boot time).
policy.scalix.projectionIntervals=2
policy.scalix.scaleUpCooldownSeconds=30
policy.scalix.scaleDownCooldownSeconds=90
policy.scalix.maxScaleUpStep=3

# ---- Experiment selection ------------------------------------------------------------
experiment.workloads=LOW,MEDIUM,HIGH,BURST,INCREASING,DECREASING,FLUCTUATING
experiment.policies=STATIC,THRESHOLD,SCALIX

# ---- Output --------------------------------------------------------------------------
export.outputDir=results
# Also write one row per request (large). Summary/timeseries/events are always written.
export.requests=false
